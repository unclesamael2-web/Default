<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Style Me Up! - Dress Up Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Style Me Up!</h1>
            <span id="version">v2.0.0</span>
        </header>

        <main>
            <div id="character-area">
                <div id="character-controls">
                    <div id="skin-tones">
                        <button class="skin-btn active" data-skin="0" style="background: #f5d0c5;"></button>
                        <button class="skin-btn" data-skin="1" style="background: #e8b89a;"></button>
                        <button class="skin-btn" data-skin="2" style="background: #d4a574;"></button>
                        <button class="skin-btn" data-skin="3" style="background: #c68642;"></button>
                        <button class="skin-btn" data-skin="4" style="background: #8d5524;"></button>
                        <button class="skin-btn" data-skin="5" style="background: #5c3a21;"></button>
                    </div>
                    <div id="pose-select">
                        <button class="pose-btn active" data-pose="standing">Stand</button>
                        <button class="pose-btn" data-pose="handOnHip">Sassy</button>
                        <button class="pose-btn" data-pose="waving">Wave</button>
                    </div>
                </div>
                <canvas id="character-canvas"></canvas>
            </div>

            <div id="wardrobe-panel">
                <div id="category-tabs">
                    <button class="tab-btn active" data-category="hair">Hair</button>
                    <button class="tab-btn" data-category="tops">Tops</button>
                    <button class="tab-btn" data-category="bottoms">Bottoms</button>
                    <button class="tab-btn" data-category="shoes">Shoes</button>
                    <button class="tab-btn" data-category="accessories">Acc</button>
                </div>

                <div id="items-container">
                    <!-- Items will be dynamically generated -->
                </div>
            </div>
        </main>

        <footer>
            <button id="clear-btn" class="action-btn">Clear All</button>
            <button id="random-btn" class="action-btn">Random</button>
            <button id="save-btn" class="action-btn">Save Look</button>
        </footer>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="game.js"></script>
</body>
</html>
