<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman Game</title>
    <link rel="stylesheet" href="pacman.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>PAC-MAN</h1>
        </div>

        <div class="game-content">
            <div class="side-panel">
                <div class="info-box">
                    <h2>Score</h2>
                    <div id="score">0</div>
                </div>

                <div class="info-box">
                    <h2>Level</h2>
                    <div id="level">1</div>
                </div>

                <div class="info-box">
                    <h2>Lives</h2>
                    <div id="lives">
                        <span class="life"></span>
                        <span class="life"></span>
                        <span class="life"></span>
                    </div>
                </div>

                <div class="info-box">
                    <h2>High Score</h2>
                    <div id="high-score">0</div>
                </div>
            </div>

            <div class="game-board">
                <canvas id="game-canvas" width="448" height="496"></canvas>
                <div id="game-over" class="game-over hidden">
                    <h2>Game Over!</h2>
                    <p>Final Score: <span id="final-score">0</span></p>
                    <button id="restart-btn">Play Again</button>
                </div>
                <div id="game-win" class="game-win hidden">
                    <h2>You Win!</h2>
                    <p>Score: <span id="win-score">0</span></p>
                    <button id="next-level-btn">Next Level</button>
                </div>
            </div>

            <div class="controls-panel">
                <h2>Controls</h2>
                <div class="control-item">
                    <span class="key">Arrow Keys</span>
                    <span class="action">Move Pacman</span>
                </div>
                <div class="control-item">
                    <span class="key">W A S D</span>
                    <span class="action">Move Pacman</span>
                </div>
                <div class="control-item">
                    <span class="key">P</span>
                    <span class="action">Pause</span>
                </div>

                <div class="legend">
                    <h3>Legend</h3>
                    <div class="legend-item">
                        <span class="dot-icon"></span>
                        <span>Dot (10 pts)</span>
                    </div>
                    <div class="legend-item">
                        <span class="power-icon"></span>
                        <span>Power Pellet (50 pts)</span>
                    </div>
                    <div class="legend-item">
                        <span class="ghost-icon"></span>
                        <span>Ghost (200 pts when blue)</span>
                    </div>
                </div>

                <button id="start-btn" class="control-button">Start Game</button>
            </div>
        </div>
    </div>

    <script src="pacman.js"></script>
</body>
</html>
